services:
  # ----------------------------------------------------
  # BANCO DE DADOS (PostgreSQL - Produção)
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tuss_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tuss_db}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tuss_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuss-prod-network

  # ----------------------------------------------------
  # BACKEND (Node.js Otimizado sem DevDependencies)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      target: production
    container_name: tuss_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-tuss_db}
    volumes:
      # Mapeia os arquivos de dados da pasta fonte
      - ./fonte:/app/fonte:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tuss-prod-network

  # ----------------------------------------------------
  # FRONTEND (Nginx Servindo Static Build + Reverse Proxy)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: tuss_frontend_prod
    restart: always
    ports:
      - "${PROD_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - tuss-prod-network

networks:
  tuss-prod-network:
    driver: bridge

volumes:
  db_data_prod:
